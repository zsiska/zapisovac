name: Zapisovac
options:
  bundleIdPrefix: cz.zsiska
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Zapisovac:
    type: application
    platform: iOS
    sources: [Zapisovac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.zsiska.zapisovac
        PRODUCT_NAME: Zapisovac
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Zapisovac/Info.plist
      properties:
        CFBundleDisplayName: Zapisovač
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: Zapisovač nahrává zvuk schůzek a hovorů.
        NSLocationWhenInUseUsageDescription: Poloha slouží k pojmenování nahrávky podle místa.
